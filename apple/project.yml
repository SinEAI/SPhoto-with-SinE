# Generate SPhoto.xcodeproj with XcodeGen: `cd apple && xcodegen generate`.
name: SPhoto
options:
  bundleIdPrefix: com.sineai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_OBJC_ARC: YES
    HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
    SWIFT_OBJC_BRIDGING_HEADER: Sources/SPhoto-Bridging-Header.h
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SPhoto
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targetTemplates:
  App:
    type: application
    sources:
      - path: Sources
      - path: ../core/src/core.cpp
      - path: ../core/src/cpu_pipeline.cpp
      - path: ../core/src/recipe.cpp
      - path: ../core/src/filters.cpp
      - path: ../core/src/grading.cpp
      - path: ../core/src/geometry.cpp
      - path: ../core/src/metal/metal_renderer.mm

targets:
  SPhoto-iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sineai.sphoto
        PRODUCT_NAME: SPhoto
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  SPhoto-macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sineai.sphoto.mac
        PRODUCT_NAME: SPhoto
        ENABLE_HARDENED_RUNTIME: YES
