name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  locate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find a verified branch build for this exact commit
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-release.yml --branch main --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId // ""')
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    needs: locate
    if: needs.locate.outputs.run_id == ''
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public repository content and history
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'privacy tests failed' }
          python tools/check_public_repo.py --history HEAD
          if ($LASTEXITCODE) { throw 'repository privacy check failed' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Restore native dependency cache
        id: native_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/vcpkg
          key: windows-2022-vcpkg-${{ hashFiles('windows/vcpkg.json') }}
      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'sphoto-vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE) { throw 'vcpkg clone failed' }
          $baseline = (Get-Content windows/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $vcpkgRoot checkout --detach $baseline
          if ($LASTEXITCODE) { throw 'vcpkg checkout failed' }
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP 'nuget')" >> $env:GITHUB_ENV
      - name: Build, test, package and check Windows x64
        shell: pwsh
        run: ./windows/build-release.ps1 -Version "0.2.0.$env:GITHUB_RUN_NUMBER"
      - name: Save native dependency cache
        if: always() && steps.native_cache.outputs.cache-hit != 'true' && hashFiles('.cache/vcpkg/**/*') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/vcpkg
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  runtime-tests:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64-release
          path: artifacts
      - name: Verify the tested build
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:GITHUB_SHA) { throw 'tested build commit mismatch' }
          foreach ($line in Get-Content artifacts/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            $actual = (Get-FileHash (Join-Path artifacts $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw 'tested asset checksum mismatch' }
          }
          $zip = (Get-ChildItem artifacts/SPhoto-*-windows-x64.zip).FullName
          Expand-Archive $zip -DestinationPath tested-app
      - name: Run generated-image runtime, 50000-file UI stress and edit-return tests
        id: diagnostics
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: ./windows/run-runtime-tests.ps1 -Exe "$env:GITHUB_WORKSPACE/tested-app/SPhoto.exe"
      - name: Upload privacy-checked test results, including failures
        if: always() && steps.diagnostics.outputs.shareable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-results
          path: runtime-results/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.build.result == 'success' || needs.locate.outputs.run_id != '')
    needs: [locate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64-release
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.locate.outputs.run_id || github.run_id }}
      - name: Verify uploaded digests and distribution
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          cd ..
          python3 tools/check_release.py --zip artifacts/SPhoto-*-windows-x64.zip
          python3 -c 'import json, os; from pathlib import Path; m=json.loads(Path("artifacts/release-manifest.json").read_text()); assert m["source_commit"] == os.environ["GITHUB_SHA"] and m["privacy_check"] == "passed"'
      - name: Publish Windows preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "SPhoto Windows x64 $GITHUB_REF_NAME" --notes-file .github/windows-release-notes.md
